<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ドパドパ読書リーダー</title>
<link rel="stylesheet" href="site.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Ccircle cx=%228%22 cy=%229%22 r=%226%22 fill=%22%23b02a3a%22/%3E%3Crect x=%229%22 y=%220%22 width=%222%22 height=%224%22 fill=%22%23ffcf3f%22/%3E%3C/svg%3E">
</head>
<body>
<!-- The floating controls (A-15): they fade after 3 s of rest. -->
<div id="controls" hidden>
  <div class="left">
    <button id="play">▶ 再生</button>
    <button id="open-contents">目次</button>
    <button id="open-jump"></button>
  </div>
  <div class="right">
    <button id="open-list">本をえらぶ</button>
    <button id="open-settings">設定</button>
    <span id="chars" class="keep"></span>
  </div>
</div>
<!-- The stage: five pixel layers (made by cockpit.js) and the HTML laid over them (SD-W13). -->
<div id="stage">
  <div id="title" hidden>
    <h1 class="rainbow">ドパドパ読書リーダー</h1>
    <p class="rainbow doujin">同人作品</p>
    <button id="select-book">SELECT A BOOK</button>
  </div>
  <div id="list" class="list" hidden></div>
  <button id="fire" class="console" aria-label="発射"></button>
  <button id="gear" class="console" aria-label="ギア" aria-pressed="false"></button>
  <button id="card-skip" class="card-skip" hidden aria-label="次へ"></button>
</div>

<div id="notice" role="status" aria-live="polite"></div>
<div id="live" class="hidden-text" aria-live="polite"></div>
<div id="announce" class="hidden-text" aria-live="polite"></div>

<dialog id="contents"><h2>目次</h2><ol id="contents-list"></ol><div id="end-notes"></div><button class="close">閉じる</button></dialog>
<dialog id="jump"><h2>ブロックを指定</h2>
  <label><input id="jump-number" type="number" min="1" inputmode="numeric"> / <span id="jump-total"></span></label>
  <label id="jump-page-row" hidden>p. <input id="jump-page" type="number" min="1" inputmode="numeric"></label>
  <div class="row"><button id="jump-go">移動</button><button class="close">閉じる</button></div>
</dialog>
<dialog id="settings"><h2>設定</h2>
  <label>速さ <input id="set-speed" type="range" min="0.5" max="2.5" step="0.1"></label>
  <label>歌 <input id="set-voice" type="range" min="0" max="1" step="0.05"></label>
  <label>オケ <input id="set-music" type="range" min="0" max="1" step="0.05"></label>
  <label>効果音 <input id="set-sfx" type="range" min="0" max="1" step="0.05"></label>
  <p class="credits"></p>
  <button class="close">閉じる</button>
</dialog>

<div id="turn" hidden><p>スマホを横にしてください</p></div>
<script type="module" src="js/main.js"></script>
</body>
</html>
